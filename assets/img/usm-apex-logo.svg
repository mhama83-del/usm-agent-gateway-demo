<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img"
     aria-label="USM Agent Gateway — logo demo (bukan logo rasmi USM)">
  <title>USM Agent Gateway — logo demo</title>
  <desc>Logo PLACEHOLDER untuk demo. Owner perlu menggantikannya dengan logo
  rasmi USM + APEX sebelum sebarang penggunaan luar.</desc>
  <defs>
    <linearGradient id="ug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2c86"/>
      <stop offset="1" stop-color="#3f1f5e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="48" height="48" rx="11" fill="url(#ug)"/>
  <rect x="0" y="45" width="48" height="7" rx="3.5" fill="#c9a227"/>
  <text x="24" y="31" text-anchor="middle" fill="#ffffff"
        font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700"
        letter-spacing="-0.5">USM</text>
  <text x="60" y="26" fill="#3f1f5e"
        font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">Agent Gateway</text>
  <text x="60" y="42" fill="#6b6b78"
        font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" letter-spacing="0.06em">APEX · DEMO SAHAJA</text>
</svg>
